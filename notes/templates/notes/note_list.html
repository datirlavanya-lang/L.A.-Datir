<!DOCTYPE html>
<html>
    <head>
        <title>Notes</title>
    </head>
     <body> 
        <h1>My Notes</h1> 
        <a href="{% url 'add_note' %}">Add New Note</a> 
        <hr> 
        {% for note in notes %} 
            <h3>{{ note.title }}</h3> 
            <p>{{ note.content }}</p> 
            <small>{{ note.created_at }}</small> 
        <hr> 
        {% empty %} 
            <p>No notes yet.</p> 
        {% endfor %} 
    </body> 
    </html>
</html>
